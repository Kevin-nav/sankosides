{% extends "base.html" %}

{% block content %}
<div class="header-region col-12">
    <h2 class="slide-title">{{ slide.title }}</h2>
</div>

<div class="content-region col-12 text-col">
    {% if slide.bullet_points %}
    <ul>
        {% for point in slide.bullet_points %}
        <li>{{ point }}</li>
        {% endfor %}
    </ul>
    {% endif %}
</div>
{% endblock %}
