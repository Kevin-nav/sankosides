[tool.poetry]
name = "sanko-backend"
version = "0.1.0"
description = "SankoSlides Backend"
authors = ["Admin <admin@sankoslides.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
fastapi = ">=0.109.0"
uvicorn = {extras = ["standard"], version = ">=0.27.0"}
python-dotenv = ">=1.0.0"
pydantic = ">=2.5.0"
pydantic-settings = ">=2.1.0"
google-genai = ">=1.0.0"
crewai = ">=0.80.0"
crewai-tools = ">=0.14.0"
convex = "==0.7.0"
httpx = ">=0.26.0"
aiohttp = ">=3.9.0"
python-multipart = ">=0.0.6"
aiofiles = ">=23.0.0"
pymupdf = ">=1.24.0"
aioboto3 = ">=12.0.0"
playwright = ">=1.40.0"
python-jose = ">=3.3.0"
python-pptx = ">=1.0.0"
latex2mathml = ">=3.77.0"
lxml = ">=5.0.0"
redis = "*"
posthog = ">=5.4.0,<6.0.0"
opentelemetry-api = ">=1.34.0,<2.0.0"
opentelemetry-sdk = ">=1.34.0,<2.0.0"
opentelemetry-exporter-otlp-proto-grpc = ">=1.34.0,<2.0.0"
opentelemetry-instrumentation-fastapi = ">=0.55b0,<1.0.0"
opentelemetry-instrumentation-httpx = ">=0.55b0,<1.0.0"
opentelemetry-instrumentation-requests = ">=0.55b0,<1.0.0"
opentelemetry-instrumentation-aiohttp-client = ">=0.55b0,<1.0.0"
opentelemetry-instrumentation-logging = ">=0.55b0,<1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
