services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.131.0
    container_name: sankoslides-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      - HONEYCOMB_API_KEY=${HONEYCOMB_API_KEY}
      - HONEYCOMB_DATASET=${HONEYCOMB_DATASET:-sankoslides}
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "13133:13133" # Health check
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
